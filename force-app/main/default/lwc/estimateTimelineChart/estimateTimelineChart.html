<template>
    <svg viewBox="0 0 1000 90" class="timeline-svg" preserveAspectRatio="none">
        <template for:each={segments} for:item="seg">
            <g key={seg.key}>
                <rect x={seg.xPx} y="10" width={seg.widthPx} height="30" fill={seg.color}></rect>
                <text x={seg.labelX} y="30" fill="#ffffff" font-size="11" text-anchor="middle">{seg.label}</text>
                <text x={seg.labelX} y="58" fill="#595959" font-size="10" text-anchor="middle">{seg.weeksLabel}</text>
            </g>
        </template>
    </svg>
    <div class="legend">
        <template for:each={segments} for:item="seg">
            <span key={seg.key} class="legend-item">
                <span class="swatch" style={seg.swatchStyle}></span>{seg.label}
            </span>
        </template>
    </div>
</template>
