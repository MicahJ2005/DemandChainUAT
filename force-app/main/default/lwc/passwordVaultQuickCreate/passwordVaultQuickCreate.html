<!-- sldsValidatorIgnore -->
<template>
    <lightning-quick-action-panel header="Create vault" lwc:if={loaded}>
        <div class="slds-p-around_medium">
            <lightning-input
                type="text"
                label="Enter desired vault name"
                value={defaultVaultName}
                onchange={handleNameChange}
                required
            ></lightning-input>
        </div>

        <div slot="footer">
            <lightning-button
                variant="neutral"
                label="Cancel"
                onclick={handleCancel}
            ></lightning-button>
            <lightning-button
                variant="brand"
                label="Create"
                class="slds-m-left_x-small"
                onclick={handleCreate}
            ></lightning-button>
        </div>
    </lightning-quick-action-panel>
    <template lwc:else>
        <div class="slds-is-relative" style="height: 200px">
            <lightning-spinner alternative-text="Loading"></lightning-spinner>
        </div>
    </template>
</template>
